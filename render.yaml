services:
  - type: web
    name: ikshuvruddhi
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    buildFilter:
      paths:
        - backend_main.py
        - ml/**
        - data/**
        - scripts/recalibrate_harvest_queue.py
        - requirements.txt
        - supabase_client.py
        - render.yaml
      ignoredPaths:
        - site-editor/**
        - web/**
        - cloudflare_public/**
        - docs/**
        - "**/*.csv"
        - "**/*.md"
        - "**/*.png"
        - "**/*.jpg"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CDSE_CLIENT_ID
        sync: false
      - key: CDSE_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
