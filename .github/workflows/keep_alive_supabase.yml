name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (9:30 AM IST)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & REST API
        env:
          PROJECT_REF: "kujuqjjxqpldkzizpjdh"
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Initiating keep-alive ping for Supabase project: $PROJECT_REF"
          URL="https://${PROJECT_REF}.supabase.co/rest/v1/"
          
          # Attempt ping with error tolerance (does not fail if project is paused)
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/resp.txt --connect-timeout 10 --max-time 15 "$URL" || echo "FAILED_DNS")
          
          echo "Base URL response: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "FAILED_DNS" ]; then
            echo "::warning ::Could not resolve https://${PROJECT_REF}.supabase.co. The project is currently PAUSED in Supabase. Please click 'Restore project' in the Supabase dashboard."
            exit 0
          fi
          
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Sending authenticated query..."
            AUTH_CODE=$(curl -s -w "%{http_code}" -o /dev/null \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --connect-timeout 10 --max-time 15 \
              "https://${PROJECT_REF}.supabase.co/rest/v1/farmer_plots?select=id&limit=1" || echo "FAILED")
            echo "Authenticated query HTTP code: $AUTH_CODE"
          fi
          
          echo "Supabase keep-alive ping routine finished."