name: Deploy Ikshu Intelligence to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare_public/**"
      - ".github/workflows/deploy_ikshu_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ikshu-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish public website
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v6

      - name: Verify Cloudflare deployment settings
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID GitHub secret"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN GitHub secret"; exit 1; }
          test -n "$CF_PROJECT_NAME" || { echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME GitHub repository variable"; exit 1; }
          test -f cloudflare_public/index.html || { echo "cloudflare_public/index.html is missing"; exit 1; }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy cloudflare_public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
