name: Deploy Ikshu Intelligence to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare_public/**"
      - ".github/workflows/deploy_ikshu_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ikshu-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish public website
    runs-on: ubuntu-latest
    steps:
      - name: Check out site files
        uses: actions/checkout@v6

      - name: Verify Cloudflare deployment settings
        id: check_creds
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ] || [ -z "$CF_API_TOKEN" ] || [ -z "$CF_PROJECT_NAME" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "### ⚠️ Cloudflare Deployment Paused (Missing Secrets)" >> $GITHUB_STEP_SUMMARY
            echo "To enable automated Cloudflare deployment, configure these in **Repository Settings -> Secrets and variables -> Actions**:" >> $GITHUB_STEP_SUMMARY
            echo "- Secret: \`CLOUDFLARE_ACCOUNT_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- Secret: \`CLOUDFLARE_API_TOKEN\`" >> $GITHUB_STEP_SUMMARY
            echo "- Variable: \`CLOUDFLARE_PAGES_PROJECT_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The latest code is safely committed and compiled in the repository." >> $GITHUB_STEP_SUMMARY
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
            test -f cloudflare_public/index.html || { echo "cloudflare_public/index.html is missing"; exit 1; }
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy cloudflare_public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
